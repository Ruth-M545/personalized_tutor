{% extends "base/base.html" %}
{% block content %}
<main class="max-w-3xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Review Cards</h1>
  {% if cards %}
    <ul class="space-y-4">
      {% for c in cards %}
        <li class="p-4 border rounded">
          <div class="font-medium">{{ c.question|truncatechars:120 }}</div>
          <div class="text-sm text-gray-600 mt-2">Topic: {{ c.topic.name }}</div>
          <div class="mt-3">
            <form method="post" action="/api/sessions/review/{{ c.id }}/">
              {% csrf_token %}
              <label class="text-xs text-gray-600">Quality (0-5)</label>
              <input type="number" name="quality" min="0" max="5" value="3" class="ml-2 w-16">
              <button type="submit" class="ml-3 px-2 py-1 bg-green-600 text-white rounded">Submit</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cards due for review.</p>
  {% endif %}
</main>
{% endblock %}
